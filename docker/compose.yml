services:
  bot-host:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: dsh-bot:dev
    container_name: dsh-bot-host
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      DSH_BOT_DRIVER: ${DSH_BOT_DRIVER:-dsh}
      DSH_APPROVAL_POLICY: ${DSH_APPROVAL_POLICY:-never}
    # 密钥只经 .env 注入（gitignored）：GLM_API_KEY/GLM_BASE_URL/GLM_MODEL
    env_file:
      - ../.env
    volumes:
      - dsh-home:/dsh-home
      - bot-state:/state
    # 出网理由（见 docker/README.md）：运行期仅需 LLM API 出网；
    # stub 模式可完全断网。严格白名单属 L3 加固项。
    networks:
      - default

volumes:
  dsh-home:
  bot-state:

networks:
  default:
    name: dsh-bot-net
