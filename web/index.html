<!doctype html>
<!-- dsh-bot 临时测试 chat：零依赖单文件，同源调用 daemon REST -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dsh-bot · 测试 Chat</title>
<style>
:root{--bg:#F0FDF4;--card:#fff;--ink:#111827;--mut:#6B7280;--pri:#059669;--line:#E5E7EB;--ac:#A7F3D0}
*{box-sizing:border-box}
body{margin:0;font:14px/1.7 "Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
header b{color:var(--pri)}
header .sp{flex:1}
button{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:13px}
button.ghost{background:#fff;color:var(--pri)}
select,input{border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;background:#fff}
main{flex:1;display:flex;min-height:0}
aside{width:200px;background:var(--card);border-right:1px solid var(--line);padding:10px;overflow:auto}
aside h4{margin:4px 0 8px;color:var(--mut);font-size:12px}
.bot-item{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.bot-item:hover{background:var(--bg)}
.bot-item.on{background:var(--ac)}
.dot{width:8px;height:8px;border-radius:50%;background:#9CA3AF}
.dot.idle{background:var(--pri)}.dot.running{background:#F59E0B}.dot.failed{background:#EF4444}.dot.awaiting_approval{background:#3B82F6}
#chat{flex:1;display:flex;flex-direction:column;min-width:0}
#feed{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:72%;padding:9px 13px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:var(--pri);color:#fff}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.msg.evt{align-self:flex-start;font-size:12px;color:var(--mut);background:transparent;border:1px dashed var(--ac);border-radius:8px}
footer{display:flex;gap:8px;padding:10px 16px;background:var(--card);border-top:1px solid var(--line)}
#text{flex:1}
#skbox{margin:0 16px 8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px}
#skbox summary{cursor:pointer;color:var(--mut);user-select:none}
.skrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.skrow:last-child{border-bottom:none}
.skmeta{display:flex;flex-direction:column;min-width:0}
.skmeta b{margin-right:8px;display:inline}
.skmeta span{color:var(--mut);word-break:break-all}
.skrow button{padding:2px 10px;font-size:12px;flex:none}
.skform{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.skform input,.skform textarea{width:100%}
textarea{border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;background:#fff;font-family:inherit;resize:vertical}
#sknote{margin-top:6px;color:#B45309;font-size:12px;display:none}
</style>
</head>
<body>
<header>
  <b>dsh-bot</b><span style="color:var(--mut)">测试 Chat（Web 临时界面）</span><span class="sp"></span>
  <input id="newbot" placeholder="新 bot 名，如 alice" style="width:150px">
  <button onclick="createBot()">＋ 建 bot</button>
  <button class="ghost" onclick="loadBots()">刷新</button>
</header>
<main>
  <aside><h4>BOTS</h4><div id="botlist"></div></aside>
  <div id="chat">
    <div id="feed"></div>
    <details id="skbox">
      <summary>技能管理（workspace/.dsh/skills · dsh 每次会话自动发现）</summary>
      <div id="sklist"></div>
      <div class="skform">
        <input id="skname" placeholder="name（kebab-case，如 tidy-report）">
        <input id="skdesc" placeholder="description（必填：bot 何时该用它）">
        <textarea id="skbody" rows="4" placeholder="body：技能正文（SKILL.md frontmatter 之外的指令内容）"></textarea>
        <div><button onclick="addSkill()">添加技能</button></div>
      </div>
      <div id="sknote"></div>
    </details>
    <footer>
      <input id="text" placeholder="给选中的 bot 发 brief…" onkeydown="if(event.key==='Enter')send()">
      <button onclick="send()">发送</button>
    </footer>
  </div>
</main>
<script>
let bots=[],cur=null,knownEvt=0,timer=null;
const $=id=>document.getElementById(id);
const feed=$("feed");
function add(cls,text){const d=document.createElement("div");d.className="msg "+cls;d.textContent=text;feed.appendChild(d);feed.scrollTop=feed.scrollHeight}
async function api(p,opt){const r=await fetch(p,opt);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);return r.json()}
async function loadBots(){try{bots=await api("/bots");}catch(e){bots=[]}
  $("botlist").innerHTML="";
  for(const b of bots){const d=document.createElement("div");d.className="bot-item"+(cur===b.name?" on":"");
    d.innerHTML=`<span>${b.name}</span><span class="dot ${b.status}" title="${b.status}"></span>`;
    d.onclick=()=>{cur=b.name;knownEvt=0;feed.innerHTML="";add("evt",`已连接 bot「${b.name}」 · 工作区 ${b.workspace}`);hideSkNote();loadBots();loadSkills()};
    $("botlist").appendChild(d)}}
async function createBot(){const n=$("newbot").value.trim();if(!n)return alert("填个名字");try{await api("/bots",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:n})});cur=n;knownEvt=0;feed.innerHTML="";add("evt",`bot「${n}」已创建`);$("newbot").value="";hideSkNote();loadBots();loadSkills()}catch(e){alert(e.message)}}
async function send(){const t=$("text").value.trim();if(!t||!cur)return alert(cur?"输入内容":"先选/建一个 bot");$("text").value="";add("me",t);
  try{const b=await api(`/bots/${cur}/brief`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({text:t})});add("bot",`状态：${b.status}\n${b.lastResult??"(无结果)"}`)}catch(e){add("evt","出错："+e.message)}}
async function poll(){if(!cur)return;try{const b=await api("/bots/"+cur);for(const e of b.events.slice(knownEvt)){if(e.kind!=="created")add("evt",`[${e.kind}] ${e.detail}`)}knownEvt=b.events.length;const s=document.querySelector(".bot-item.on .dot");if(s)s.className="dot "+b.status}catch{}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function hideSkNote(){$("sknote").style.display="none"}
// CB6：技能目录消息是入会话日志的历史快照，变更后旧会话看不到——每次增删都提示
function skillNote(){const n=$("sknote");n.textContent="技能变更对已绑定会话的历史目录不生效，建议新会话（CB6）";n.style.display="block"}
async function loadSkills(){
  const el=$("sklist");
  if(!cur){el.innerHTML="";return}
  let ss=[];try{ss=await api(`/bots/${cur}/skills`)}catch(e){el.innerHTML=`<div class="skmeta"><span>加载失败：${esc(e.message)}</span></div>`;return}
  el.innerHTML=ss.length?"":'<span style="color:var(--mut)">（暂无技能）</span>';
  for(const s of ss){const d=document.createElement("div");d.className="skrow";
    const m=document.createElement("div");m.className="skmeta";m.innerHTML=`<b>${esc(s.name)}</b><span>${esc(s.description)}</span>`;
    const btn=document.createElement("button");btn.className="ghost";btn.textContent="删除";btn.onclick=()=>delSkill(s.name);
    d.append(m,btn);el.appendChild(d)}}
async function addSkill(){
  if(!cur)return alert("先选/建一个 bot");
  const name=$("skname").value.trim(),description=$("skdesc").value.trim(),body=$("skbody").value;
  if(!name||!description)return alert("name 与 description 必填（name 须 kebab-case）");
  try{await api(`/bots/${cur}/skills/${encodeURIComponent(name)}`,{method:"PUT",headers:{"content-type":"application/json"},body:JSON.stringify({name,description,body})});
    $("skname").value="";$("skdesc").value="";$("skbody").value="";await loadSkills();skillNote()}catch(e){alert(e.message)}}
async function delSkill(n){
  try{await api(`/bots/${cur}/skills/${encodeURIComponent(n)}`,{method:"DELETE"});await loadSkills();skillNote()}catch(e){alert(e.message)}}
loadBots();timer=setInterval(poll,2000);
</script>
</body>
</html>
